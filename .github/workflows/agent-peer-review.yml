name: Multi-Agent PR Peer Review Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'sections/**'
      - 'docs/**'
      - '*.md'
      - 'synapseforge.yaml'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  agent-peer-review:
    name: Swarm Agent Peer Review Matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install SynapseForge
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyyaml requests markdown jinja2

      - name: Run Multi-Agent PR Peer Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          synapseforge review --base origin/${{ github.base_ref }} --pr ${{ github.event.pull_request.number }}
